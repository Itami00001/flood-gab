<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J HUB - Аренда</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">J HUB</div>
            <ul class="nav-menu">
                <li><a href="index.html">Каталог</a></li>
                <li><a href="rentals.html">Аренда</a></li>
                <li><a href="profile.html">Профиль</a></li>
                <li><span id="balanceDisplay" class="balance-display" style="display: none;">Баланс: 0 COIN</span></li>
                <li><a href="login.html" id="loginLink">Войти</a></li>
            </ul>
        </div>
    </nav>

    <main>
    <section class="rentals">
        <div class="container">
            <h2>Аренда автомобилей</h2>
            <div class="date-filters">
                <label>Статус: 
                    <select id="statusFilter">
                        <option value="">Все статусы</option>
                        <option value="active">Активные</option>
                        <option value="completed">Завершённые</option>
                        <option value="cancelled">Отменённые</option>
                    </select>
                </label>
                <label>Начало: <input type="date" id="startDate"></label>
                <label>Конец: <input type="date" id="endDate"></label>
                <button onclick="filterRentals()">Фильтровать</button>
                <button onclick="loadRentalsTable()">Сбросить</button>
            </div>
            <div id="rentalsTable">
                <!-- Rentals table will be loaded here -->
            </div>
        </div>
    </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 J HUB. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
