<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J HUB - Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">J HUB</div>
            <ul class="nav-menu">
                <li><a href="index.html">Каталог</a></li>
                <li><a href="rentals.html">Аренда</a></li>
                <li><a href="profile.html">Профиль</a></li>
                <li><a href="login.html" id="loginLink">Войти</a></li>
            </ul>
        </div>
    </nav>

    <main>
    <section class="login">
        <div class="container">
            <div class="login-form">
                <h2>Вход в систему</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Имя пользователя:</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit">Войти</button>
                </form>
                <div class="quick-login">
                    <p>Быстрый вход:</p>
                    <button onclick="quickLogin('admin', 'adminadmin')">Admin</button>
                    <button onclick="quickLogin('test', 'testtest')">Test User</button>
                </div>
                <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            </div>
        </div>
    </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 J HUB. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
